# Деплой на Cloudflare Pages (Direct Upload через wrangler).
# Нативная связка «Connect to Git» в Dashboard CLI не умеет — этот workflow её заменяет.
#
# Запускается НЕ по push напрямую, а ПОСЛЕ успешного прогона workflow «CI»
# (typecheck + lint + test) на ветке main — красная сборка больше не деплоится.
# Ручной запуск (workflow_dispatch) по-прежнему работает.

name: Deploy Cloudflare Pages

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # workflow_run — только зелёный CI на main; ручной запуск — без условий.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    permissions:
      contents: read
    steps:
      # По событию workflow_run checkout по умолчанию берёт ветку по умолчанию —
      # явно указываем коммит, который прошёл CI. При workflow_dispatch
      # head_sha пуст, и берётся выбранная в UI ветка (github.ref).
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/generate-config.js && npm run build:bundle

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=kar-tochki --branch=main --commit-dirty=true

      - name: Post-deploy smoke (CSP + sw.js)
        run: node scripts/post-deploy-smoke.mjs https://kar-tochki.pages.dev
