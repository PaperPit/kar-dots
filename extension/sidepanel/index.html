<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>КАР-точки</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <!--
      Заглушка внутри #app — диагностика на случай, когда скрипт вообще не
      загрузился (пустой extension/dist, ошибка разбора бандла). Раньше в этой
      ситуации окно было просто пустым, и отличить «скрипт не загрузился» от
      «скрипт упал на старте» было нечем. Заглушку снимает
      src/sidepanel/error-guard.ts первой же строкой выполнения.
    -->
    <div id="app" class="app">
      <div id="kar-boot-fallback" class="card">
        <p class="error">Скрипт расширения не загрузился</p>
        <p class="muted">
          Обычно это значит, что папка <code>extension/dist</code> пуста или
          устарела. Собери расширение командой <code>npm run ext:build</code>, а
          затем нажми «Обновить» на странице <code>chrome://extensions</code>.
        </p>
      </div>
    </div>
    <script type="module" src="../dist/sidepanel.js"></script>
  </body>
</html>
